name: refarch
version: "1.0.0"
config-version: 2
profile: refarch

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

# Schemas are <target schema>_<layer>: refarch_staging, refarch_marts in prod;
# refarch_dev_staging, refarch_dev_marts in dev. dbt's default generate_schema_name does this.
# All of them live in the one DuckDB file, so `duckdb warehouse/refarch.duckdb` then
# `show all tables` shows the entire warehouse, raw layer included.
models:
  refarch:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Marts are the contract with the business; everything upstream is plumbing. Whatever
      # BI tool sits on top should expose this tag and nothing else.
      +tags: ["bi"]

# Checked in on purpose: it contains no secrets, and with DuckDB it needs none. A fresh clone
# runs against it as-is -- REFARCH_WAREHOUSE only exists so `refarch` can point dbt at a
# warehouse somewhere other than the default, and the fallback is the path the CLI uses.
#
# The path is relative to dbt's working directory, which is this folder.
refarch:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('REFARCH_WAREHOUSE', '../warehouse/refarch.duckdb') }}"
      schema: refarch_dev
      threads: 8
    prod:
      type: duckdb
      path: "{{ env_var('REFARCH_WAREHOUSE', '../warehouse/refarch.duckdb') }}"
      schema: refarch
      threads: 8

<!doctype html>
<!--
  Source of evidence/static/og.png, the social card for reference.jbanalytica.com.

  Same arrangement as docs/architecture/diagram.html: this HTML is the thing you edit, and the
  PNG next to it is an export. Re-render with the recipe in CLAUDE.md. Colours are the website's
  tokens and the faces are the site's self-hosted Poppins, so the card matches jbanalytica.com
  rather than approximating it.

  The two figures are the live ones from the marts (booked and realised revenue for the
  generated year). They are the only concrete numbers on the card, and they are what the whole
  project is an argument about -- if a run ever moves them, re-export.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: block;
    src: url('../../evidence/static/fonts/poppins-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Poppins'; font-style: normal; font-weight: 600; font-display: block;
    src: url('../../evidence/static/fonts/poppins-600-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Poppins'; font-style: normal; font-weight: 700; font-display: block;
    src: url('../../evidence/static/fonts/poppins-700-latin.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; background: #071D3D; color: #FFFFFF;
    font-family: 'Poppins', system-ui, sans-serif;
    padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .card::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #FA9306;
  }
  .eyebrow {
    font-size: 19px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: #A8C9EE;
  }
  h1 { font-size: 52px; font-weight: 700; line-height: 1.16; letter-spacing: -0.015em; max-width: 26ch; }
  h1 em { font-style: normal; color: #FA9306; }
  .figures { display: flex; gap: 72px; }
  .figure .amount { font-size: 62px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .figure .label { font-size: 21px; font-weight: 600; margin-top: 14px; color: #FFFFFF; }
  .figure .note { font-size: 18px; font-weight: 400; margin-top: 4px; color: #A8C9EE; }
  .rule { width: 1px; background: rgba(168, 201, 238, 0.35); }
  footer {
    font-size: 19px; color: #A8C9EE; display: flex; justify-content: space-between;
    border-top: 1px solid rgba(168, 201, 238, 0.28); padding-top: 22px;
  }
  footer strong { color: #FFFFFF; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <p class="eyebrow">JB Analytica · Reference architecture</p>
      <h1 style="margin-top: 22px">One year of orders. <em>Two defensible revenue figures.</em></h1>
    </div>

    <div class="figures">
      <div class="figure">
        <div class="amount">€346,644</div>
        <div class="label">Booked</div>
        <div class="note">Every order as placed</div>
      </div>
      <div class="rule"></div>
      <div class="figure">
        <div class="amount">€329,441</div>
        <div class="label">Realised</div>
        <div class="note">Cancellations count as zero</div>
      </div>
    </div>

    <footer>
      <span><strong>reference.jbanalytica.com</strong> — the platform that settles it, published whole</span>
      <span>dbt · DuckDB · Evidence</span>
    </footer>
  </div>
</body>
</html>

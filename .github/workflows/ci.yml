name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check refarch
      - run: uv run pytest

  pipeline:
    # The whole stack, for real, on every pull request. This is only possible because the
    # warehouse is a DuckDB file: there is no account to hold a secret for, nothing to gate the
    # job on, and nothing left behind. The BigQuery version of this job could only run when a
    # GCP_SA_KEY secret happened to be present, which meant forks never ran it at all.
    name: Full run (generate -> load -> transform)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - name: generate -> load -> transform
        run: uv run refarch run --target prod
      - name: Source freshness
        run: uv run refarch transform source freshness --target prod
      # The built warehouse is the artefact worth having: download it and open it with
      # `duckdb refarch.duckdb` to inspect exactly what this commit produces.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: warehouse
          path: warehouse/refarch.duckdb
          retention-days: 7

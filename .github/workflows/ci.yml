name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check refarch
      - run: uv run pytest

      # The dbt charts board reaches its marts through ref(), so a renamed or dropped mart
      # column fails here -- before the pipeline job builds a warehouse for it to be missing
      # from. `dbt parse` writes target/manifest.json from the model SQL alone: no warehouse,
      # no credentials, about a second. dbt charts is pinned because it is pre-1.0 and its YAML
      # surface is still moving; see docs/versions.md.
      - name: Validate the dbt charts board
        # prod because the board's source declares `target: prod`: ref() takes its schema from
        # the manifest, so a manifest parsed against dev would send the board at
        # refarch_dev_marts while it connects to the prod one. See charts/README.md.
        env:
          DBT_TARGET: prod
        run: |
          uv run dbt parse --project-dir dbt --profiles-dir dbt
          uvx --from dbt-charts==0.8.0 dct validate --strict \
              --project-dir charts webshop_performance.yml

  pipeline:
    # The whole stack, for real, on every pull request. This is only possible because the
    # warehouse is a DuckDB file: there is no account to hold a secret for, nothing to gate the
    # job on, and nothing left behind. The BigQuery version of this job could only run when a
    # GCP_SA_KEY secret happened to be present, which meant forks never ran it at all.
    name: Full run (generate -> load -> transform -> report)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          # Evidence needs Node 18 or newer. 20 is what the report is developed against.
          node-version: 20
          cache: npm
          cache-dependency-path: evidence/package-lock.json
      - run: uv sync
      - run: npm ci
        working-directory: evidence
      - name: generate -> load -> transform -> report
        run: uv run refarch run --target prod
      - name: Source freshness
        run: uv run refarch transform source freshness --target prod
      # Two artefacts worth having: the warehouse, which `duckdb refarch.duckdb` opens, and
      # the report, which is a static site -- unzip it and serve the folder with any static
      # file server. It needs no backend, but it does need a web root: the asset URLs are
      # absolute from the site root, so opening index.html over file:// renders it unstyled.
      #
      # v7, not v5: v5 declares `runs.using: node20`, and the runners now force those onto
      # Node 24 with a deprecation warning on every run. v6 moved to node24 and v7 added an
      # opt-in `archive: false` for single unzipped files; leaving it at its default keeps
      # these two uploads zipped exactly as before.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: warehouse
          path: warehouse/refarch.duckdb
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: evidence/build
          retention-days: 7

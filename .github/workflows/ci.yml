name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check refarch
      - run: uv run pytest

  pipeline:
    # The whole stack, for real, on every pull request. This is only possible because the
    # warehouse is a DuckDB file: there is no account to hold a secret for, nothing to gate the
    # job on, and nothing left behind. The BigQuery version of this job could only run when a
    # GCP_SA_KEY secret happened to be present, which meant forks never ran it at all.
    name: Full run (generate -> load -> transform -> report)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          # Evidence needs Node 18 or newer. 20 is what the report is developed against.
          node-version: 20
          cache: npm
          cache-dependency-path: evidence/package-lock.json
      - run: uv sync
      - run: npm ci
        working-directory: evidence
      - name: generate -> load -> transform -> report
        run: uv run refarch run --target prod
      - name: Source freshness
        run: uv run refarch transform source freshness --target prod
      # Two artefacts worth having: the warehouse, which `duckdb refarch.duckdb` opens, and
      # the report, which is a static site -- unzip it and serve the folder with any static
      # file server. It needs no backend, but it does need a web root: the asset URLs are
      # absolute from the site root, so opening index.html over file:// renders it unstyled.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: warehouse
          path: warehouse/refarch.duckdb
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report
          path: evidence/build
          retention-days: 7
